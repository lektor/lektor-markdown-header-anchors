---
name: 🧪 CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

env:
  uv-version: "0.10.4"
  FORCE_COLOR: "1"

jobs:
  ############################################################################
  # Python tests
  ############################################################################
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.uv-version }}

      - name: Run Tests
        run: uv run noxfile.py

  publish:
    name: Build & Publish
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.uv-version }}

      - name: Build Distribution
        run: uv build

      - name: Publish to PyPI
        # Only run on push of tags matching "v*"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}

